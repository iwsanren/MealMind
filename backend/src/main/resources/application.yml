spring:
  application:
    name: mealmind-backend
  # Pulls prompts-config.yaml in as part of the same configuration tree,
  # so PromptProperties (@ConfigurationProperties(prefix = "prompts")) can
  # bind to it without merging its content into this file by hand.
  config:
    import: classpath:prompts-config.yaml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mealmind?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:mealmind}
    password: ${SPRING_DATASOURCE_PASSWORD:mealmind}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/*.xml

# Chat -> ai-service. Off by default; when on, any failure falls back to the rule-based recommender.
mealmind:
  agent:
    enabled: ${MEALMIND_AGENT_ENABLED:false}
    base-url: ${MEALMIND_AGENT_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${MEALMIND_AGENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${MEALMIND_AGENT_READ_TIMEOUT_MS:35000}
