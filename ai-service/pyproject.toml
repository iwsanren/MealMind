[project]
name = "mealmind-ai-service"
version = "0.1.0"
description = "MealMind AI service: FastAPI wrapper around LLM calls"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
